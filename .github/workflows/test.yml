name: Test

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run Linters and TSC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webeep-sync-recordings
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.34.5
          package_json_file: webeep-sync-recordings/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: webeep-sync-recordings/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test

  transcriber:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Transcriber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Transcriber/pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -c "import transcriber.worker"
