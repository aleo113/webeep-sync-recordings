[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polimi-transcriber"
version = "0.1.0"
description = "Reusable lecture transcription and notes-generation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1",
    "pymupdf>=1.24.10",
    "pypdf>=4.3.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
transcriber = "transcriber.cli:main"
transcriber-worker = "transcriber.worker:main"

[tool.setuptools]
packages = ["transcriber"]
package-dir = { transcriber = "src" }
